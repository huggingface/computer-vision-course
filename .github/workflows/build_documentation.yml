name: Build documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@17ccdf17e0f5e5f88b1ce9f20b3b73fb19017169  # main
    with:
      commit_sha: ${{ github.sha }}
      package: computer-vision-course
      package_name: computer-vision-course
      path_to_docs: computer-vision-course/chapters/
      additional_args: --not_python_module
      languages: en
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}